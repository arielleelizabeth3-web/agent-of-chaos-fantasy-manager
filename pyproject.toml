[project]
name = "gridiron-agent"
version = "0.1.0"
description = "An auditable AI manager for a Yahoo Fantasy Football team"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "openai>=1.99",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
gridiron = "fantasy_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fantasy_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]


